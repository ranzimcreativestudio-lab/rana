name: Deploy to GitHub Pages

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the workflow publish Pages on your behalf.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run finish and skip the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository is the site — there is no build step.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
